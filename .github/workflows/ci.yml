name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Typecheck, lint, test and build with the dev tools.
  # Vitest needs Node 20+, and pnpm 11 needs a recent Node, so this job
  # runs on Node 22 and 24 only.
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Run the built package on every Node version that package.json "engines"
  # allows, without installing any dev tools.
  smoke:
    name: Smoke test (Node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - run: node scripts/smoke-test.mjs
